[toolchain]
# An exact version, not "stable": a floating channel lets a new release's lints turn
# `clippy -D warnings` red with no code change. Equals RUST_VERSION in tools/versions.env, which
# `just doctor rust` enforces (docs/adr/0015).
channel = "1.98.0"
components = ["rustfmt", "clippy", "rust-src"]
targets = [
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "i686-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]
profile = "minimal"
