# Pre-commit hooks. Installed by `just setup`; run `lefthook install` if commits are not being
# checked. Never commit with hooks disabled (docs/DEVELOPMENT.md §5).
#
# These are fast checks only. `just verify` is the gate; this is the thing that stops an obviously
# broken commit from being written in the first place.

pre-commit:
  # In sequence: three jobs `git add` what they format, and in parallel they race for the index
  # lock, which fails a commit at random with exit 128 (seen in T-002b). Each job takes milliseconds.
  parallel: false
  jobs:
    - name: dart-format
      glob: "*.dart"
      # The generated FRB tree is formatted by `just gen`, not here.
      exclude:
        - "**/lib/src/rust/**"
        - "**/*.g.dart"
        - "**/*.freezed.dart"
        - "packages/audio_engine/cargokit/**"   # vendored, not ours to format
      run: dart format {staged_files} && git add {staged_files}

    - name: rust-format
      glob: "*.rs"
      exclude:
        - "**/frb_generated.rs"
      run: rustfmt --edition 2024 {staged_files} && git add {staged_files}

    - name: kotlin-format
      glob: "*.kt"
      exclude:
        - "**/*.g.kt"   # Pigeon's output, regenerated by `just gen`
      run: tools/ktfmt.sh format {staged_files} && git add {staged_files}

    - name: secrets
      # A safety net, not permission to be careless. .gitignore is the first line of defence.
      run: |
        if git diff --cached --name-only --diff-filter=A |
             grep -EI '\.(keystore|jks|p8|p12|pem|mobileprovision|cer)$|(^|/)\.env($|\.)'; then
          echo "✗ refusing to commit a secret-shaped file. See AGENTS.md §8."
          exit 1
        fi

    - name: large-files
      # Source sample libraries run to gigabytes and live outside the repo; only curated recordings
      # under fixtures/audio/ may be large, and docs/adr/0030 caps those (T-019).
      run: |
        git diff --cached --name-only --diff-filter=AM | {
          bad=0
          while IFS= read -r f; do
            case "$f" in
              *.zip|*.7z|*.tar|*.tar.*|*.tgz|*.rar)
                echo "✗ refusing to commit an archive: $f (keep sources outside the repo)"; bad=1 ;;
              fixtures/audio/*) ;;
              *) if [ "$(git cat-file -s ":$f")" -gt 1048576 ]; then
                   echo "✗ refusing to commit a file over 1 MiB outside fixtures/audio/: $f"; bad=1
                 fi ;;
            esac
          done
          exit "$bad"
        }

commit-msg:
  jobs:
    - name: conventional-commit
      # {1} is lefthook's placeholder for the commit-message file. A bare "$1" is empty here.
      run: |
        head -1 {1} | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9_-]+\))?!?: .+' || {
          echo "✗ Conventional Commits, imperative mood (AGENTS.md §3.4)."
          echo "  e.g. feat(tuner): add strobe ring painter"
          exit 1
        }
