name: diapason
description: Instrument tuner and metronome. The app shell, and nothing else.
version: 0.1.0+1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  audio_engine: ^0.1.0
  core_domain: ^0.1.0
  core_platform: ^0.1.0
  core_ui: ^0.1.0
  feature_metronome: ^0.1.0
  feature_settings: ^0.1.0
  feature_tuner: ^0.1.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.2
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Exact, and only together: PATROL_VERSION and PATROL_CLI_VERSION in tools/versions.env are the
  # pins, and doctor checks pubspec.lock against them (docs/adr/0026). The CLI runs from here as
  # `dart run patrol_cli:main`, like melos, so the lockfile is its install.
  patrol: 4.10.0
  patrol_cli: 4.8.0

flutter:
  uses-material-design: true

# Read by patrol_cli (docs/adr/0026). Device tests run against the dev flavour, which installs
# beside the others.
patrol:
  app_name: Diapasón
  flavor: dev
  test_directory: patrol_test
  android:
    package_name: dev.jfcofer.diapason.dev
