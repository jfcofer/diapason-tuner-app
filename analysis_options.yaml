# Root lint configuration. Packages may extend this; they may never relax it.
# A rule that has to be disabled to make code compile is a signal about the code.

include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore   # freezed/json_serializable false positive
    todo: warning
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/frb_generated*.dart"
    - "**/l10n/app_localizations*.dart"
  plugins:
    - custom_lint

linter:
  rules:
    # Additions beyond very_good_analysis that matter for this codebase specifically.
    avoid_print: true                       # logging goes through core_platform
    prefer_const_constructors: true         # every const widget is a rebuild avoided
    prefer_const_literals_to_create_immutables: true
    use_super_parameters: true
    sort_pub_dependencies: true
    unawaited_futures: true
    always_declare_return_types: true
    avoid_slow_async_io: true
    cancel_subscriptions: true              # engine snapshot streams must be cancelled
    close_sinks: true
