# Root lint configuration. Packages may extend this; they may never relax it.
# A rule that has to be disabled to make code compile is a signal about the code.

include: package:very_good_analysis/analysis_options.yaml

# `dart format` reads this, so the formatter and the linter cannot disagree about line length.
# 100 is what .editorconfig has always said for this repo.
formatter:
  page_width: 100

# First-party analyzer plugins (docs/adr/0014). Top-level key, not `analyzer.plugins` - that was
# the custom_lint mechanism, which this repo no longer uses. Findings surface in `dart analyze`.
plugins:
  riverpod_lint: ^3.1.8

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore   # freezed/json_serializable false positive
    todo: warning
    # very_good_analysis enforces 80; .editorconfig says 100 and the formatter above agrees.
    # One of them had to give, and .editorconfig is the older contract.
    lines_longer_than_80_chars: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # flutter_rust_bridge generates this whole tree, not just frb_generated*.dart.
    # Regenerate it with `just gen`; never hand-edit it (docs/REPO_LAYOUT.md).
    - "**/lib/src/rust/**"
    - "**/l10n/app_localizations*.dart"
    # cargokit's vendored build tool: third-party, its own pubspec and language version, and not a
    # workspace member. It is updated by re-vendoring, never edited (docs/adr/0012).
    - "packages/audio_engine/cargokit/**"
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Additions beyond very_good_analysis that matter for this codebase specifically.
    avoid_print: true                       # logging goes through core_platform
    prefer_const_constructors: true         # every const widget is a rebuild avoided
    prefer_const_literals_to_create_immutables: true
    use_super_parameters: true
    sort_pub_dependencies: true
    unawaited_futures: true
    always_declare_return_types: true
    avoid_slow_async_io: true
    cancel_subscriptions: true              # engine snapshot streams must be cancelled
    close_sinks: true
