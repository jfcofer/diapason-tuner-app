name: core_platform
description: Interfaces and implementations for permissions, audio capabilities, haptics, wakelock, prefs, lifecycle.
version: 0.1.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.1
  flutter: ">=3.47.0"

dependencies:
  core_domain: ^0.1.0
  flutter:
    sdk: flutter
  # MIT, no network calls, ships a privacy manifest, supports SwiftPM. Checked for T-002b. iOS
  # compiles in only the microphone (PERMISSION_MICROPHONE, tools/ios/configure_project.rb).
  # Held at 12: 13 pulls permission_handler_android 14, which needs compileSdk 37, and the pin
  # (ANDROID_COMPILE_SDK in tools/versions.env) moves only in its own task (AGENTS.md §8).
  permission_handler: ^12.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Typed platform channels (docs/adr/0024). Pinned exactly: its output depends on the version.
  # Run by `just gen-dart`; the output is generated, not committed, like build_runner's.
  pigeon: 29.0.4

# A Flutter plugin, so its Kotlin registers with the engine like any other plugin. Android only:
# on iOS the capabilities are unknown until T-002c.
flutter:
  plugin:
    platforms:
      android:
        package: dev.jfcofer.diapason.core_platform
        pluginClass: CorePlatformPlugin
