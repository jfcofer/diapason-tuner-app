[package]
name = "diapason_ffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "diapason_ffi"
crate-type = ["cdylib", "staticlib"]

[dependencies]
flutter_rust_bridge.workspace = true
# The only workspace crate this one may name (docs/adr/0022; tools/check-deps.sh enforces it).
diapason_session.workspace = true
# The debug app's global allocator, so a real-time allocation aborts it (AUDIO_ENGINE.md §7).
assert_no_alloc.workspace = true

# NOT `[lints] workspace = true`: the workspace forbids unsafe_code, and this crate is one of the
# two places AGENTS.md §7 permits it, because flutter_rust_bridge's generated bindings require it.
# Every hand-written unsafe block here still carries a // SAFETY: comment.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
