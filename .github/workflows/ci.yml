# CI. Every step runs a `just` recipe: nothing here is logic a developer or an agent cannot
# reproduce locally with one command (docs/CI_RELEASE.md §1).
#
# Versions come from tools/versions.env and rust-toolchain.toml through the local toolchain action;
# none is written in this directory (docs/adr/0011, docs/adr/0015). Each job then runs
# `just doctor <sections>` on what it installed, so a job cannot pass on the wrong toolchain.
#
# Third-party actions are pinned by commit SHA, with the release in a comment; Dependabot bumps
# both together (.github/dependabot.yml).

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_BACKTRACE: 1
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          rust: "true"
          tools: cargo-nextest,cargo-deny
      - run: just doctor rust rust-tools
      - run: just fmt-check-rust
      - run: just lint-rust
      - run: just test-rust
      - run: just deny
      - run: just doc-rust

  dart:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          flutter: "true"
      - run: just deps   # pub get + Dart codegen
      - run: just doctor flutter
      - run: just fmt-check-dart
      - run: just lint-dart
      - run: just test-dart

  # Goldens are platform-specific, so they run on exactly one pinned image (docs/adr/0016).
  goldens:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          flutter: "true"
      - run: just deps   # pub get + Dart codegen
      - run: just doctor flutter
      - run: just goldens

  # Repository invariants: pins, generated code, dependency direction, docs, CI config, iOS project.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          flutter: "true"
          rust: "true"
          frb: "true"
          actionlint: "true"
          xcodeproj: "true"
          tools: shellcheck
      - run: just deps   # pub get + Dart codegen
      - run: just doctor flutter rust frb repo-tools
      - run: just doctor-selftest flutter rust frb repo-tools   # prove doctor still fails when it should
      - run: just check-drift                         # regenerating must produce no diff
      - run: just ios-project-check                   # regenerating the Xcode project, likewise
      - run: just check-deps                          # one-way dependency rule, AGENTS.md §5
      - run: just docs-check                          # links, line budgets, ADR index
      - run: just lint-ci                             # actionlint + shellcheck

  build-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          flutter: "true"
          java: "true"
          rust: "true"
          android-ndk: "true"
      - run: just deps   # pub get + Dart codegen
      - run: just doctor flutter java rust android
      - run: just build-android prod
      # targetSdk 36, per-ABI 16 KB alignment, size budget.
      - run: just check-android-release

  # The only place iOS is compiled at all: there is no macOS host on this project, so a red job
  # here is a red build, not someone else's problem (docs/DEVELOPMENT.md §2). No `just doctor`:
  # it needs GNU grep, and the toolchain action installs the pins by construction.
  build-ios:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/toolchain
        with:
          flutter: "true"
          rust: "true"
      - run: just deps   # pub get + Dart codegen
      - run: just build-ios-unsigned prod
      - run: just check-ios-release
